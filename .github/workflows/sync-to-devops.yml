name: Sync to DevOps Monorepo

on:
  push:
    branches: [main]

permissions: {}

jobs:
  token-check:
    if: ${{ github.event_name == 'push' && github.repository == 'Team-2-Skill-Project/Backend' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check whether the sync token is configured
        id: check
        env:
          DEVOPS_SYNC_TOKEN: ${{ secrets.DEVOPS_SYNC_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$DEVOPS_SYNC_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: token-check
    if: ${{ github.event_name == 'push' && github.repository == 'Team-2-Skill-Project/Backend' && github.ref == 'refs/heads/main' && needs.token-check.result == 'success' && needs.token-check.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source

      - name: Checkout DevOps-Infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Team-2-Skill-Project/DevOps-Infrastructure
          token: ${{ secrets.DEVOPS_SYNC_TOKEN }}
          path: devops

      - name: Sync Backend Files
        run: |
          mkdir -p devops/Backend
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='Dockerfile*' \
            --exclude='.dockerignore' \
            source/ devops/Backend/
          if [ -f source/Dockerfile ]; then
            cp -a source/Dockerfile devops/Backend/
          fi
          if [ -f source/.dockerignore ]; then
            cp -a source/.dockerignore devops/Backend/
          fi

      - name: Commit & Push to DevOps
        run: |
          cd devops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Backend/
          if git diff --staged --quiet; then
            echo "No changes to sync"
          else
            git commit -m "sync(backend): update from commit ${{ github.sha }}"
            git push origin main
          fi
